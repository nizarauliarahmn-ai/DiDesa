<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Completely Transparent Background - White Document + Yellow Spines Only -->
  <g transform="translate(64, 64)">
    <!-- Main White Document Sheet -->
    <rect x="0" y="0" width="220" height="384" rx="48" fill="#FFFFFF" />
    
    <!-- Subtle Spine Accent on Left of White Sheet -->
    <rect x="0" y="0" width="64" height="384" rx="32" fill="#E2E8F0" opacity="0.7" />

    <!-- Yellow Accent Bookmark Spine 1 -->
    <rect x="246" y="32" width="64" height="320" rx="32" fill="#FACC15" />

    <!-- Orange Accent Bookmark Spine 2 -->
    <rect x="330" y="72" width="44" height="240" rx="22" fill="#F59E0B" />
  </g>
</svg>
