<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="didesa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Rounded Emerald Container -->
  <rect width="512" height="512" rx="128" fill="url(#didesa-grad)" />

  <!-- DiDesa Icon Graphic (Book / App Folder with Yellow Spine) -->
  <g transform="translate(106, 116)">
    <!-- White Main Body -->
    <rect x="20" y="30" width="200" height="220" rx="44" fill="#FFFFFF" filter="url(#shadow)" />
    
    <!-- Inner Spine Detail -->
    <rect x="20" y="30" width="60" height="220" rx="30" fill="#F1F5F9" />
    
    <!-- Right Yellow Page Spine 1 -->
    <rect x="236" y="60" width="38" height="160" rx="19" fill="#FACC15" />
    
    <!-- Right Yellow Page Spine 2 -->
    <rect x="284" y="80" width="22" height="120" rx="11" fill="#F59E0B" />
  </g>
</svg>
