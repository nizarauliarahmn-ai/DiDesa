<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mencegah caching agresif oleh browser/PWA agar app selalu memuat versi terbaru -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
    <title>DiDesa</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DiDesa - Portal Warga" />
    <meta property="og:description" content="Portal informasi, layanan administrasi, dan transparansi data desa." />
    <meta property="og:site_name" content="DiDesa" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:image" content="/logo.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/logo.jpg" />
    <meta name="twitter:title" content="DiDesa - Portal Warga" />
    <meta name="twitter:description" content="Portal informasi, layanan administrasi, dan transparansi data desa." />
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var tab = params.get('tab');
        var skId = params.get('sk_id');
        var perdesId = params.get('perdes_id');
        var title = 'DiDesa - Portal Warga';
        var description = 'Portal informasi, layanan administrasi, dan transparansi data desa.';
        if (tab === 'sk_kades' && skId) {
          title = 'Detail SK Kepala Desa | DiDesa';
          description = 'Buka tautan ini untuk melihat detail produk hukum, dasar penetapan, dan lampiran Surat Keputusan Kepala Desa.';
        } else if (tab === 'perdes' && perdesId) {
          title = 'Detail Peraturan Desa | DiDesa';
          description = 'Buka tautan ini untuk melihat detail Peraturan Desa (Perdes), dasar penetapan, dan lampiran dokumen hukum desa.';
        } else if (tab === 'berita_acara' && params.get('ba_id')) {
          title = 'Detail Berita Acara | DiDesa';
          description = 'Buka tautan ini untuk melihat detail Berita Acara desa, tanggal pelaksanaan, dan lampiran dokumen.';
        }
        document.title = title;
        var metaOgTitle = document.querySelector('meta[property="og:title"]');
        var metaOgDesc = document.querySelector('meta[property="og:description"]');
        var metaOgSite = document.querySelector('meta[property="og:site_name"]');
        var metaTwTitle = document.querySelector('meta[name="twitter:title"]');
        var metaTwDesc = document.querySelector('meta[name="twitter:description"]');
        if (!metaOgTitle) { metaOgTitle = document.createElement('meta'); metaOgTitle.setAttribute('property', 'og:title'); document.head.appendChild(metaOgTitle); }
        if (!metaOgDesc) { metaOgDesc = document.createElement('meta'); metaOgDesc.setAttribute('property', 'og:description'); document.head.appendChild(metaOgDesc); }
        if (!metaOgSite) { metaOgSite = document.createElement('meta'); metaOgSite.setAttribute('property', 'og:site_name'); document.head.appendChild(metaOgSite); }
        if (!metaTwTitle) { metaTwTitle = document.createElement('meta'); metaTwTitle.setAttribute('name', 'twitter:title'); document.head.appendChild(metaTwTitle); }
        if (!metaTwDesc) { metaTwDesc = document.createElement('meta'); metaTwDesc.setAttribute('name', 'twitter:description'); document.head.appendChild(metaTwDesc); }
        metaOgTitle.content = title;
        metaOgDesc.content = description;
        metaOgSite.content = 'DiDesa';
        metaTwTitle.content = title;
        metaTwDesc.content = description;
      })();
    </script>
    <script>
      // --- Diagnostik boot: bila aplikasi gagal jalan (browser TV/STB lama,
      // JS error, dll) tampilkan keterangan di layar, bukan layar kosong. ---
      window.__bootError = '';
      window.addEventListener('error', function (e) {
        if (!window.__bootError && e && e.message) window.__bootError = String(e.message);
      }, true);
      document.addEventListener('DOMContentLoaded', function () {
        var root = document.getElementById('root');
        var splash = document.getElementById('boot-splash');
        if (!root || !splash) return;
        // Sembunyikan splash segera begitu React tampil.
        if (window.MutationObserver) {
          new MutationObserver(function () {
            if (root.childNodes.length > 0) splash.style.display = 'none';
          }).observe(root, { childList: true });
        }
        // Cadangan: 5 detik tanpa konten = gagal → tampilkan sebabnya di layar.
        setTimeout(function () {
          if (root.childNodes.length > 0) { splash.style.display = 'none'; return; }
          var err = window.__bootError;
          splash.innerHTML =
            '<div style="text-align:center;padding:0 8vw;font-family:sans-serif;line-height:1.5">' +
            '<p style="font-size:26px;font-weight:800;color:#0f172a">Memuat DiDesa gagal / terlalu lama</p>' +
            (err ? '<p style="font-size:17px;color:#b91c1c;margin-top:10px;font-family:monospace;word-break:break-word">Kesalahan: ' + err.replace(/</g, '&lt;') + '</p>' : '') +
            '<p style="font-size:16px;color:#64748b;margin-top:10px">Coba muat ulang halaman. Bila tetap gagal, browser perangkat ini kemungkinan terlalu tua — buka lewat Chrome/WebView terbaru.</p>' +
            '</div>';
        }, 5000);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" style="position:fixed;inset:0;z-index:9999;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:22px;font-weight:700;color:#334155">Memuat DiDesa&hellip;</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
